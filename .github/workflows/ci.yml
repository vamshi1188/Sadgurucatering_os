name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Run tests
        run: go test ./...

      - name: Run vet
        run: go vet ./...

      - name: Build API
        run: go build ./cmd/api

      - name: Build migration binary
        run: go build ./cmd/migrate

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config

  integration:
    name: Local Integration
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - docker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config

      - name: Build integration stack
        run: docker compose build

      - name: Start integration stack
        run: docker compose up -d

      - name: Show service status
        run: docker compose ps

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if docker compose exec -T postgres \
              pg_isready -U sadguru -d sadguru >/dev/null 2>&1; then
              echo "PostgreSQL is ready"
              exit 0
            fi

            sleep 2
          done

          echo "PostgreSQL did not become ready"
          docker compose logs postgres
          exit 1

      - name: Wait for backend
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8080/api/v1/health >/dev/null; then
              echo "Backend is ready"
              exit 0
            fi

            sleep 2
          done

          echo "Backend did not become ready"
          docker compose logs backend
          exit 1

      - name: Run database migrations
        run: docker compose exec -T backend /app/migrate up

      - name: Verify migration state
        run: |
          docker compose exec -T postgres \
            psql -U sadguru -d sadguru \
            -c "SELECT version, dirty FROM schema_migrations;" \
            -c "SELECT id, schema_version, application_version FROM schema_metadata ORDER BY id;"

          docker compose exec -T postgres \
            psql -U sadguru -d sadguru \
            -v ON_ERROR_STOP=1 \
            -c "SELECT 1 FROM schema_migrations WHERE version = 2 AND dirty = false;" \
            -c "SELECT 1 FROM schema_metadata WHERE schema_version = 2 AND application_version = '1.0.10';"

      - name: Verify backend health
        run: |
          response="$(curl -fsS http://localhost:8080/api/v1/health)"

          echo "$response"

          echo "$response" | grep -q '"status":"ok"'
          echo "$response" | grep -q '"request_id"'

      - name: Verify unknown API route
        run: |
          status="$(curl -s -o /dev/null -w "%{http_code}" \
            http://localhost:8080/api/v1/does-not-exist)"

          test "$status" = "404"

      - name: Wait for frontend
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:3000/ >/dev/null; then
              echo "Frontend is ready"
              exit 0
            fi

            sleep 2
          done

          echo "Frontend did not become ready"
          docker compose logs frontend
          exit 1

      - name: Verify frontend
        run: |
          status="$(curl -s -o /dev/null -w "%{http_code}" \
            http://localhost:3000/)"

          test "$status" = "200"

      - name: Show integration logs
        if: always()
        run: docker compose logs --tail=100

      - name: Tear down integration stack
        if: always()
        run: docker compose down -v
