services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: development
      APP_NAME: Sadguru Catering OS
      APP_VERSION: 1.0.10
      LOG_LEVEL: info
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8080
      DATABASE_URL: postgres://sadguru:sadguru_dev_password@postgres:5432/sadguru?sslmode=disable
      REDIS_URL: ""
      STORAGE_ENDPOINT: ""
      STORAGE_BUCKET: ""
      STORAGE_ACCESS_KEY: ""
      STORAGE_SECRET_KEY: ""
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sadguru
      POSTGRES_USER: sadguru
      POSTGRES_PASSWORD: sadguru_dev_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sadguru -d sadguru"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
