services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: development
      APP_NAME: Sadguru Catering OS
      APP_VERSION: 1.0.5
      LOG_LEVEL: info
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8080
      DATABASE_URL: ""
      REDIS_URL: ""
      STORAGE_ENDPOINT: ""
      STORAGE_BUCKET: ""
      STORAGE_ACCESS_KEY: ""
      STORAGE_SECRET_KEY: ""
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
